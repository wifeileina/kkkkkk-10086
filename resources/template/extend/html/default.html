<!doctype html>
<html lang="zh-cn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link href="#" rel="shortcut icon" />
    <link href="{{_res_path}}template/extend/css/common.css" rel="stylesheet" type="text/css" />
    <link href="{{_res_path}}font/font.css" type="text/css" rel="stylesheet">
    <!-- 仅保留国内可达的 fonts.font.im，去除 googleapis（大陆常被墙）与不可靠代理，
        避免每次渲染时 waitUntil:'load' 长时间等待外部字体而拖慢出图 -->
    <link href="https://fonts.font.im/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link
      href="https://fonts.font.im/css2?family=Libre+Barcode+128&family=Noto+Color+Emoji&family=Noto+Emoji:wght@300..700&display=swap"
      rel="stylesheet">
    <title>kkkkkk-10086</title>
    {{block 'css'}} {{/block}}
  </head>

  <body {{@sys.scale}}>
    <div class="container" id="container">
      {{block 'main'}}{{/block}}
      <div class="copyright">{{@copyright}}</div>
      <script>
        // 获取当前时间并自动设置主题
        function setThemeBasedOnTime () {
          const body = document.body
          if ('{{useDarkTheme}}' === 'true') {
            body.classList.remove('light-mode')
            body.classList.add('dark-mode')
          } else {
            body.classList.remove('dark-mode')
            body.classList.add('light-mode')
          }
        }

        // 页面加载时调用函数自动设置主题
        window.onload = function () {
          setThemeBasedOnTime()
        }
      </script>
    </div>
  </body>
</html>
