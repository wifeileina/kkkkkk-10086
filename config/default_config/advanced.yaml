# ===== 增强能力 =====
# 超限档位权限：使用「xk解析档位」时，谁能选择体积超过上限的清晰度档位。
# 无权限者仍能看到档位列表，但按下方「超限档位显示」处理。
tierOverLimitPermission: master

# 超限档位显示方式：
# open：开放，全部档位可选（不做限制）
# limit：限制，超限档位单独列出但不可选
# hide：隐藏，超限档位折叠为「存在更高档位」
tierOverLimitDisplay: limit

# ===== 惰解析 =====
# 开启后，列表中的群只有带解析指令（如 #解析 / #xk解析）的消息才会被解析；
# 裸链接、纯图片等自动触发将不再解析，需用户主动带上指令才能解析。
manualParseEnabled: false

# 需带指令才解析的群号列表（逗号/回车分隔多个群号）
manualParseGroups: []

# ===== 批量解析 =====
# 允许使用「xk批量解析」的身份，可选值：all / admin / master / group.owner / group.admin
batchParsePermission: master

# ===== 文件发送 =====
# 文件发送模式，可选值：all(全部媒体发文件)、image(仅图文/实况发文件)、normal(普通发送)
# all：视频 / 图集 / 实况图及其视频 / BGM 均以文件发送
# image：只把图集与实况（含其视频）转文件，视频与 BGM 正常发送
fileSendMode: normal

# 压缩包发送：仅「文件 / 仅图文」模式生效。开启后同一解析结果的多个媒体
# （图集 / 实况图及其视频）打包成一个 zip 发送，避免逐个文件刷屏；
# 关闭则逐个文件发送；只有单个媒体时仍直接发送文件。
# 媒体本身已压缩（jpg/mp4），打包仅归档，不做二次压缩。
fileSendArchive: true

# 媒体超过该数量时才会打包成 zip，默认 3（即 4 个及以上）。
# 同一组实况的图片与其视频同名同组，只算 1 个。
fileSendArchiveMinCount: 3