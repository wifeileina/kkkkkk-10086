# 发送视频经本插件转换为base64格式后再发送，适合云崽与机器人不在同一网络环境下开启
sendbase64: false

# 本地视频发送方式，可选值：file / base64 / url。会同步兼容 sendbase64。
videoSendMode: file

# 视频上传拦截，开启后会根据解析的视频文件大小判断是否需要上传
usefilelimit: true

# 视频拦截阈值（填数字），视频文件大于该数值则不会上传 单位: MB，「视频文件上传限制」开启后才会生效
filelimit: 100

# 压缩视频，开启后会将视频文件压缩后再上传，适合上传大文件
compress: false

# 触发视频压缩的阈值，单位：MB。当文件大小超过该值时，才会压缩视频，「压缩视频」开启后才会生效
compresstrigger: 100

# 压缩后的值，若视频文件大小大于「触发视频压缩的阈值」的值，则会进行压缩至该值（±5%），「压缩视频」开启后才会生效
compressvalue: 50

# 使用文件上传，开启后会将视频文件上传到群文件中，私聊也行
usegroupfile: false

# 群文件上传阈值，当文件大小超过该值时将使用群文件上传，单位：MB，「使用群文件上传」开启后才会生效
groupfilevalue: 100

# 网络图片发送方式，可选值：url / file / base64
imageSendMode: url

# 多线程下载开关，开启后对支持 Range 的大文件使用分片并发下载
downloadMultiThread: false

# 多线程下载并发数，建议 2-8，数值过高可能触发服务器限流
downloadConcurrency: 4

# 下载限速开关，开启后会限制下载速度，避免触发服务器风控导致连接被重置
downloadThrottle: false

# 下载速度限制，单位：MB/s，仅在 downloadThrottle 开启后生效
downloadMaxSpeed: 10

# 断流自动降速，检测到连接被重置时自动降低下载速度
downloadAutoReduce: true

# 最低下载速度，单位：MB/s，自动降速不会低于此值
downloadMinSpeed: 1

# ===== 配额限制 =====
# 每日流量配额：开启后按当日限额统计上传/下载流量，超限后仅解析信息图，不再下载/发送视频
quota:
  # 总量开关，关闭则配额限制不生效
  enable: false
  # 每日下载配额，单位：MB。当日已下载 + 本次 >= 该值时停止下载视频，仅出信息图；0 表示不限制
  downloadLimit: 0
  # 每日上传配额，单位：MB。当日已上传 + 本次 >= 该值时停止发送视频，仅出信息图；0 表示不限制
  uploadLimit: 0
  # 超额强制解析权限：配额超限后，拥有该权限的人仍可正常下载/发送视频。取值：all / master / admin / group.owner / group.admin
  # 设为 master（主人）时信息图不显示强制提示；设为其他等级时会在信息图提示「继续下载指令：xk解析 权限:xxx」
  forcePermission: master
  # 主人不计入配额：主人(机器人主人)超限时始终可正常解析下载；开启后主人流量不计入配额统计，
  # 关闭则主人流量计入统计但主人仍不被配额拦截
  masterExempt: true
