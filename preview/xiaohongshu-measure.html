/* 封面模糊氛围底（对齐示例插件 AmbientCover）：氛围层只覆盖「底部到标题上方一点」，
   顶部完全透明（删除顶部模糊），从约 72% 处（标题上方）渐变显示，
   86% 后完全不透明覆盖到底部 */
.ambient {
  inset: 0;
  overflow: hidden;
  position: absolute;
  z-index: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 72%, rgba(0, 0, 0, 0.35) 77%, rgba(0, 0, 0, 0.8) 82%, #000 86%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, transparent 72%, rgba(0, 0, 0, 0.35) 77%, rgba(0, 0, 0, 0.8) 82%, #000 86%, #000 100%);
}

.ambient img {
  filter: blur(120px) saturate(1.8);
  height: 100%;
  object-fit: cover;
  opacity: 0.7;
  transform: scale(1.5);
  width: 100%;
}

/* 三段压色罩：edge(顶/底)浓、middle(中)淡，信息区中部透出封面氛围 */
.ambient::after {
  content: '';
  inset: 0;
  position: absolute;
}

body.light-mode .ambient::after {
  background: linear-gradient(
    180deg,
    rgba(247, 243, 241, 0.92) 0%,
    rgba(247, 243, 241, 0.12) 50%,
    rgba(247, 243, 241, 0.92) 100%
  );
}

body.dark-mode .ambient::after {
  background: linear-gradient(
    180deg,
    rgba(17, 17, 17, 0.9) 0%,
    rgba(17, 17, 17, 0.16) 50%,
    rgba(17, 17, 17, 0.9) 100%
  );
}

.cover {
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.cover img {
  display: block;
  height: auto;
  object-fit: contain;
  width: 100%;
  /* 顶部约 90% 保持完全清晰，底部 ~10% 平滑溶解到透明，
     溶解结束位置与氛围层开始位置衔接，露出下方氛围层 */
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 90%, rgba(0, 0, 0, 0.7) 95%, rgba(0, 0, 0, 0.3) 98%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 90%, rgba(0, 0, 0, 0.7) 95%, rgba(0, 0, 0, 0.3) 98%, transparent 100%);
}
