/* ============================================================
   抖音作品信息卡片 - 简洁版式（参考 bilibili videoInfo）
   氛围层对齐参考插件 karin-plugin-kkk-main 的 AmbientCover：
   模糊封面 + 三段压色罩。氛围层全卡铺底，由封面底部溶解自然露出，
   顶部被清晰封面遮挡（删除顶部模糊），氛围层只出现在底部到标题上方
   ============================================================ */

/* 信息图为内容卡，隐藏 default.html 布局壳底部的版权条，
   避免信息区下方出现深色版权行（黑边） */
.copyright {
  display: none !important;
}

/* 容器与页面底色：顶部封面区域保持中性渐变底 */
body.light-mode .video-info-page,
body.light-mode .container {
  background: linear-gradient(180deg, #eef0f2 0%, #f7f7f7 100%);
  color: #232323;
}

body.dark-mode .video-info-page,
body.dark-mode .container {
  background: linear-gradient(180deg, #181818 0%, #202021 100%);
  color: #ececec;
}

.video-info-page {
  min-height: 100%;
  position: relative;
  overflow: hidden;
  /* 覆盖容器 padding（20px/15px/10px）区域，避免四周露出纯色边框 */
  margin: -20px -15px 0;
  padding: 20px 15px 10px;
}

/* ---------- 氛围层（对齐参考插件 AmbientCover）----------
   全卡铺底的模糊封面 + 三段压色罩。顶部被清晰封面遮挡，
   封面底部溶解处自然露出氛围层，向下覆盖整个信息区 */
.ambient {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.ambient img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(120px) saturate(1.8);
  transform: scale(1.5);
  opacity: 0.7;
}

/* 三段压色罩：edge(顶/底)浓、middle(中)淡，信息区中部透出封面氛围 */
.ambient::after {
  content: '';
  position: absolute;
  inset: 0;
}

body.light-mode .ambient::after {
  background: linear-gradient(
    180deg,
    rgba(240, 242, 244, 0.85) 0%,
    rgba(240, 242, 244, 0.85) 60%,
    rgba(240, 242, 244, 0.5) 82%,
    rgba(245, 245, 245, 0.9) 100%
  );
}

body.dark-mode .ambient::after {
  background: linear-gradient(
    180deg,
    rgba(26, 27, 29, 0.85) 0%,
    rgba(26, 27, 29, 0.85) 60%,
    rgba(26, 27, 29, 0.5) 82%,
    rgba(26, 27, 29, 0.9) 100%
  );
}

/* ---------- 封面：清晰保留，仅底部一小段溶解露出氛围层 ---------- */
.cover-wrap {
  display: block;
  margin: -20px -15px 0;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.cover {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  /* 顶部约 90% 保持完全清晰，底部 ~10% 平滑溶解到透明，
     露出下方氛围层，过渡自然无硬边 */
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 90%, rgba(0, 0, 0, 0.7) 95%, rgba(0, 0, 0, 0.3) 98%, transparent 100%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 90%, rgba(0, 0, 0, 0.7) 95%, rgba(0, 0, 0, 0.3) 98%, transparent 100%);
}

/* ---------- 信息区：我们自己的文字排版，氛围层透出为背景 ---------- */
.content {

}
