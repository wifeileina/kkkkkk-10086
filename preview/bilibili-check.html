/* ============================================================
   B站视频信息卡片
   氛围层对齐参考插件 karin-plugin-kkk-main 的 AmbientCover：
   模糊封面 + 三段压色罩。氛围层仅覆盖底部到标题上方，
   顶部保留清晰封面（删除顶部模糊）
   ============================================================ */

/* 信息图为内容卡，隐藏 default.html 布局壳底部的版权条，
   避免信息区下方出现深色版权行（黑边） */
.copyright {
  display: none !important;
}

body.light-mode .container {
  background: #f4f4f4;
  color: #232323;
  overflow: hidden;
  width: 1440px;
}

body.dark-mode .container {
  background: #111;
  color: #ececec;
  overflow: hidden;
  width: 1440px;
}

.video-info-page {
  min-height: 100%;
  position: relative;
  overflow: hidden;
  /* 覆盖容器 padding（20px/15px/10px）区域，避免四周露出纯色边框 */
  margin: -20px -15px 0;
  padding: 20px 15px 10px;
}

/* ---------- 封面：顶部清晰保留，无模糊 ---------- */
.cover-wrap {
  margin: -20px -15px 0;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.cover {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

/* ---------- 弹幕层 (仅B站) ---------- */
.danmaku-layer {
  height: 50%;
  left: 52px;
  overflow: hidden;
  position: absolute;
  right: 52px;
  top: 36px;
  z-index: 3;
}

.danmaku-layer span {
  color: #fff;
  display: inline-block;
  font-size: 38px;
  font-weight: 700;
  line-height: 1.8;
  margin-right: 32px;
  text-shadow: 0 3px 8px rgba(0, 0, 0, 0.86), 0 0 2px rgba(0, 0, 0, 0.95);
  white-space: nowrap;
}

/* ---------- 信息区：我们自己的文字排版，氛围层透出为背景 ---------- */
.content {
  isolation: isolate;
  position: relative;
  z-index: 3;
  padding: 0 86px 72px;
}

body.dark-mode .content {
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.6);
}

/* ---------- 氛围层（对齐参考插件 AmbientCover）----------
   模糊封面 + 三段压色罩。仅覆盖底部到标题上方：
   顶部被清晰封面遮挡，氛围层从标题上方一点开始向下铺满信息区 */
.ambient {
  position: absolute;
  top: -20px; /* 上探封面底部，封面边缘晕染出氛围色，过渡平滑 */
  left: 0;
  right: 0;
  bottom: -10px; /* 覆盖页面底部 padding，避免露出底色条 */
  z-index: -1;
  overflow: hidden;
}

.ambient img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(120px) saturate(1.8);
  transform: scale(1.5);
  opacity: 0.42;
}

/* 三段压色罩：顶部淡让封面底部氛围色晕开过渡平滑，
   中下部渐浓保证信息区文字可读、色系稳定中性 */
.ambient::after {
  content: '';
  position: absolute;
  inset: 0;
}

body.light-mode .ambient::after {
  background: linear-gradient(
    180deg,
    rgba(244, 244, 244, 0.5) 0%,
    rgba(244, 244, 244, 0.66) 22%,
    rgba(244, 244, 244, 0.78) 55%,
    rgba(244, 244, 244, 0.96) 100%
  );
}

body.dark-mode .ambient::after {
  background: linear-gradient(
    180deg,
    rgba(22, 22, 26, 0.5) 0%,
    rgba(22, 22, 26, 0.62) 22%,
    rgba(22, 22, 26, 0.72) 55%,
    rgba(22, 22, 26, 0.94) 100%
  );
}
